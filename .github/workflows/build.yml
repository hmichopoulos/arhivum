name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ubuntu-latest runners ship with Docker, so Testcontainers integration
      # tests run here — no silent skipping.
      - name: Build and test
        run: ./gradlew build --no-daemon
